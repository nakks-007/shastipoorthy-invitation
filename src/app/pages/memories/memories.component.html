<!-- 🔥 Premium Loader (Same as App Loader) -->
<div *ngIf="isLoading" class="loader-wrapper" [class.fade-out]="!isLoading">
  <div class="loader-content">
    <div class="loader-ring"></div>
    <div class="loader-icon">🪔</div>
    <p class="loader-text">
      Preparing Memories...
    </p>
  </div>
</div>

<!-- ✅ Actual Content -->
<div *ngIf="!isLoading" class="px-4 py-10 animate-fadeInUp">

  <h2 class="text-3xl md:text-4xl text-center text-primary font-semibold tracking-wide mb-2">
    Journey & Memories
  </h2>

  <div class="w-20 h-1 bg-gold mx-auto mb-8 rounded"></div>

  <!-- Section 1 -->
  <div class="max-w-4xl mx-auto bg-white/80 backdrop-blur-md rounded-2xl shadow-xl p-6">

    <h3 class="text-xl text-gold mb-4 text-center font-medium">
      A Journey of Togetherness
    </h3>

    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
      <img #imgRef src="assets/memory1.JPG" (load)="onImageLoad()" (error)="onImageLoad()"
        class="rounded-xl shadow hover:scale-105 transition duration-300" />

      <img #imgRef src="assets/memory2.JPG" (load)="onImageLoad()" (error)="onImageLoad()"
        class="rounded-xl shadow hover:scale-105 transition duration-300" />
    </div>

  </div>

  <!-- Section 2 -->
  <div class="max-w-4xl mx-auto bg-white/80 backdrop-blur-md rounded-2xl shadow-xl p-6 mt-6">

    <h3 class="text-xl text-gold mb-6 text-center font-medium">
      Recent Memories
    </h3>

    <div class="space-y-10">

      <!-- Kerala -->
      <div class="text-center">
        <p class="font-semibold text-primary text-lg">Kerala</p>

        <div class="grid grid-cols-2 gap-4 mt-3">

          <img #imgRef src="assets/kerala1.JPG" (load)="onImageLoad()" (error)="onImageLoad()"
            class="rounded-xl shadow hover:scale-105 transition duration-300 row-span-2 object-cover h-full w-full" />

          <img #imgRef src="assets/kerala2.jpg" (load)="onImageLoad()" (error)="onImageLoad()"
            class="rounded-xl shadow hover:scale-105 transition duration-300 object-cover" />

          <img #imgRef src="assets/kerala3.JPG" (load)="onImageLoad()" (error)="onImageLoad()"
            class="rounded-xl shadow hover:scale-105 transition duration-300 object-cover" />

        </div>
      </div>

      <!-- Mayiladuthurai -->
      <div class="text-center">
        <p class="font-semibold text-primary text-lg">Mayiladuthurai & Kumbakonam</p>

        <div class="grid grid-cols-2 gap-4 mt-3">

          <img #imgRef src="assets/mylai1.jpg" (load)="onImageLoad()" (error)="onImageLoad()"
            class="rounded-xl shadow hover:scale-105 transition duration-300 row-span-2 object-cover h-full w-full" />

          <img #imgRef src="assets/mylai2.jpg" (load)="onImageLoad()" (error)="onImageLoad()"
            class="rounded-xl shadow hover:scale-105 transition duration-300 object-cover" />

          <img #imgRef src="assets/mylai3.jpg" (load)="onImageLoad()" (error)="onImageLoad()"
            class="rounded-xl shadow hover:scale-105 transition duration-300 object-cover" />

        </div>
      </div>

      <!-- Thiruchendur -->
      <div class="text-center">
        <p class="font-semibold text-primary text-lg">Thiruchendur</p>

        <div class="grid grid-cols-2 gap-4 mt-3">

          <img #imgRef src="assets/thiru1.jpg" (load)="onImageLoad()" (error)="onImageLoad()"
            class="rounded-xl shadow hover:scale-105 transition duration-300 row-span-2 object-cover h-full w-full" />

          <img #imgRef src="assets/thiru2.jpg" (load)="onImageLoad()" (error)="onImageLoad()"
            class="rounded-xl shadow hover:scale-105 transition duration-300 object-cover" />

          <img #imgRef src="assets/thiru3.jpg" (load)="onImageLoad()" (error)="onImageLoad()"
            class="rounded-xl shadow hover:scale-105 transition duration-300 object-cover" />

        </div>
      </div>

    </div>

  </div>

</div>
